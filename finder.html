<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador de Retiros — Wellnest Guide</title>
<meta name="description" content="Encuentra tu retiro de bienestar ideal en España. Buscador inteligente con IA personalizado a tu perfil, presupuesto y experiencia.">
<link rel="canonical" href="https://wellnest.guide/finder">
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --sage: #7a8c6e;
  --sage-light: #b5c4a8;
  --sage-pale: #e8ede5;
  --warm-white: #faf8f4;
  --earth: #8b6f47;
  --earth-light: #c4a882;
  --charcoal: #2c2c2c;
  --mist: #f0f4ee;
  --terracota: #c4714a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--warm-white); color:var(--charcoal); min-height:100vh; }

/* NAV */
nav {
  position:fixed; top:0; width:100%; z-index:200;
  padding:18px 48px; display:flex; align-items:center; justify-content:space-between;
  background:rgba(250,248,244,0.95); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(122,140,110,0.15);
}
.nav-logo img { height:26px; display:block; }
.nav-back { font-size:12px; color:#888; text-decoration:none; letter-spacing:.06em; display:flex; align-items:center; gap:6px; transition:color .2s; }
.nav-back:hover { color:var(--sage); }

/* LAYOUT */
.app { display:grid; grid-template-columns:1fr 1fr; min-height:100vh; padding-top:62px; }

/* LEFT */
.panel-left { padding:52px 52px 52px 60px; overflow-y:auto; border-right:1px solid rgba(122,140,110,0.12); background:var(--warm-white); }
.form-eyebrow { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--earth); display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.form-eyebrow::before { content:''; display:block; width:24px; height:1px; background:var(--earth-light); }
.form-title { font-family:'Cormorant Garamond',serif; font-size:38px; font-weight:300; line-height:1.15; margin-bottom:8px; }
.form-title em { font-style:italic; color:var(--sage); }
.form-sub { font-size:14px; color:#888; font-weight:300; line-height:1.6; margin-bottom:40px; }

/* Steps */
.steps-indicator { display:flex; gap:8px; margin-bottom:36px; }
.step-dot { height:3px; border-radius:2px; background:var(--sage-pale); transition:all .4s; flex:1; }
.step-dot.active { background:var(--sage); }
.step-dot.done { background:var(--sage-light); }

/* Question */
.q-block { margin-bottom:32px; animation:fadeIn .4s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.q-label { font-size:13px; font-weight:500; color:var(--charcoal); margin-bottom:4px; }
.q-hint { font-size:12px; color:#aaa; margin-bottom:14px; }

/* Pills */
.pill-group { display:flex; flex-wrap:wrap; gap:10px; }
.pill {
  padding:9px 18px; border-radius:2px; cursor:pointer;
  font-size:13px; border:1.5px solid rgba(122,140,110,0.25);
  background:white; color:#666; transition:all .2s; user-select:none;
}
.pill:hover { border-color:var(--sage); color:var(--sage); }
.pill.selected { background:var(--sage); border-color:var(--sage); color:white; }
.pill.multi.selected { background:var(--sage-pale); border-color:var(--sage); color:var(--sage); }

/* Range */
.slider-wrap { padding:6px 0; }
.range-val { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:300; color:var(--charcoal); margin-bottom:10px; }
.range-labels { display:flex; justify-content:space-between; font-size:11px; color:#bbb; margin-top:8px; }
input[type=range] { -webkit-appearance:none; width:100%; height:3px; background:var(--sage-pale); border-radius:2px; outline:none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--sage); cursor:pointer; box-shadow:0 2px 8px rgba(122,140,110,0.4); }

/* Radio cards */
.radio-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.radio-card { border:1.5px solid rgba(122,140,110,0.2); border-radius:2px; padding:14px; cursor:pointer; transition:all .2s; background:white; }
.radio-card:hover { border-color:var(--sage); }
.radio-card.selected { border-color:var(--sage); background:var(--sage-pale); }
.radio-card-icon { font-size:20px; margin-bottom:6px; }
.radio-card-title { font-size:13px; font-weight:500; margin-bottom:2px; }
.radio-card-sub { font-size:11px; color:#999; font-weight:300; }

/* Buttons */
.cta-btn {
  width:100%; padding:15px; background:var(--sage); color:white; border:none;
  font-family:'DM Sans',sans-serif; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; font-weight:500; cursor:pointer; border-radius:2px;
  margin-top:12px; transition:background .2s;
}
.cta-btn:hover { background:var(--earth); }
.cta-btn:disabled { background:#ccc; cursor:default; }
.back-btn {
  flex:0 0 auto; padding:13px 20px; background:white;
  border:1.5px solid rgba(122,140,110,0.3); border-radius:2px;
  cursor:pointer; font-family:'DM Sans',sans-serif; font-size:11px;
  letter-spacing:.08em; text-transform:uppercase; color:#888; transition:all .2s;
}
.back-btn:hover { border-color:var(--sage); color:var(--sage); }

/* RIGHT */
.panel-right { background:var(--mist); overflow-y:auto; padding:44px 44px 44px 36px; }

/* Loading */
.loading-wrap { text-align:center; padding:80px 0; }
.spinner { width:30px; height:30px; border:2px solid var(--sage-pale); border-top-color:var(--sage); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 20px; }
@keyframes spin { to{transform:rotate(360deg)} }
.loading-txt { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:300; color:#888; }
.loading-sub { font-size:12px; color:#bbb; margin-top:8px; }

/* Empty state */
.empty-state { text-align:center; padding:100px 40px; }
.empty-icon { font-size:48px; margin-bottom:20px; opacity:.4; }
.empty-title { font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:300; color:#aaa; margin-bottom:8px; }
.empty-sub { font-size:13px; color:#ccc; line-height:1.6; }

/* Results header */
.results-eyebrow { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--earth); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.results-eyebrow::before { content:''; display:block; width:20px; height:1px; background:var(--earth-light); }
.results-title { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:300; line-height:1.2; margin-bottom:6px; }
.results-title em { font-style:italic; color:var(--sage); }
.results-sub { font-size:12px; color:#bbb; margin-bottom:24px; }

/* Insight */
.insight-box { background:white; border-left:3px solid var(--sage); padding:14px 18px; border-radius:0 2px 2px 0; margin-bottom:24px; font-size:13px; line-height:1.65; color:#555; font-weight:300; }

/* Affiliate note */
.affiliate-note { background:rgba(139,111,71,0.06); border:1px solid rgba(139,111,71,0.18); border-radius:2px; padding:12px 14px; margin-bottom:22px; font-size:11px; color:#999; line-height:1.6; }
.affiliate-note strong { color:var(--earth); }

/* Result card */
.result-card { background:white; border-radius:2px; margin-bottom:18px; overflow:hidden; transition:box-shadow .3s; border:1px solid rgba(122,140,110,0.1); }
.result-card:hover { box-shadow:0 8px 32px rgba(0,0,0,0.08); }
.card-header { display:grid; grid-template-columns:90px 1fr; }
.card-visual { display:flex; align-items:center; justify-content:center; font-size:32px; }
.card-info { padding:14px 14px 14px 0; }
.platform-badge {
  display:inline-flex; align-items:center; gap:4px;
  font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  font-weight:500; padding:3px 8px; border-radius:20px; margin-bottom:7px;
}
.platform-booking { background:#003580; color:white; }
.platform-gyg { background:#ff5533; color:white; }
.platform-directo { background:var(--sage); color:white; }
.card-name { font-family:'Cormorant Garamond',serif; font-size:17px; font-weight:400; line-height:1.2; margin-bottom:3px; }
.card-location { font-size:11px; color:#bbb; letter-spacing:.04em; margin-bottom:7px; }
.card-tags { display:flex; gap:5px; flex-wrap:wrap; }
.card-tag { font-size:10px; padding:2px 8px; background:var(--sage-pale); color:var(--sage); border-radius:20px; }
.card-body { padding:0 14px 14px; border-top:1px solid var(--mist); }
.card-desc { font-size:12px; color:#888; line-height:1.6; font-weight:300; padding:10px 0 12px; }
.card-footer { display:flex; align-items:center; justify-content:space-between; }
.price-from { font-size:10px; color:#bbb; }
.price-num { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:300; color:var(--charcoal); line-height:1; }
.price-unit { font-size:10px; color:#bbb; }
.card-right { display:flex; flex-direction:column; align-items:flex-end; gap:7px; }
.match-wrap { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--sage); font-weight:500; }
.match-bar { width:50px; height:3px; background:var(--sage-pale); border-radius:2px; overflow:hidden; }
.match-fill { height:100%; background:var(--sage); border-radius:2px; }
.comm-badge { font-size:10px; background:rgba(122,140,110,0.1); color:var(--sage); padding:3px 8px; border-radius:20px; }
.book-btn {
  padding:9px 18px; background:var(--charcoal); color:white; border:none;
  font-family:'DM Sans',sans-serif; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; cursor:pointer; border-radius:1px; transition:background .2s;
  text-decoration:none; display:inline-block;
}
.book-btn:hover { background:var(--sage); }

/* Commission summary */
.comm-summary { background:white; border:1px solid rgba(122,140,110,0.15); border-radius:2px; padding:18px; margin-top:24px; }
.comm-summary h4 { font-family:'Cormorant Garamond',serif; font-size:17px; font-weight:400; margin-bottom:12px; }
.comm-row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--mist); font-size:12px; }
.comm-row:last-child { border-bottom:none; font-weight:500; padding-top:10px; }
.comm-label { color:#888; }
.comm-val { color:var(--sage); font-weight:500; }

@media(max-width:900px) {
  .app { grid-template-columns:1fr; }
  .panel-left { padding:40px 24px; }
  .panel-right { padding:40px 24px; }
  nav { padding:14px 20px; }
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo"><img src="/assets/logo.svg" alt="Wellnest Guide"></a>
  <a href="/" class="nav-back">← Volver al directorio</a>
</nav>

<div class="app">
  <div class="panel-left">
    <div class="form-eyebrow">Buscador inteligente</div>
    <h1 class="form-title">Tu retiro <em>perfecto</em><br>en 2 minutos</h1>
    <p class="form-sub">Cuéntanos qué necesitas y nuestra IA encontrará las mejores opciones verificadas en España.</p>
    <div class="steps-indicator" id="stepsIndicator"></div>
    <div id="formContent"></div>
  </div>
  <div class="panel-right" id="rightPanel">
    <div class="empty-state">
      <div class="empty-icon">🌿</div>
      <div class="empty-title">Tus recomendaciones<br>aparecerán aquí</div>
      <div class="empty-sub">Completa el formulario y nuestra IA buscará<br>los retiros que mejor encajan contigo.</div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ─────────────────────────────────────────────────────────
// Tu Affiliate ID de Booking.com — sustitúyelo aquí:
const BOOKING_AID = 'TU_AFFILIATE_ID';

// ── AFFILIATE LINK BUILDER ──────────────────────────────────────────
function buildBookingLink(searchTerm, region) {
  const regionMap = {
    andalucia:'Andalucía,España', cataluna:'Cataluña,España',
    galicia:'Galicia,España', canarias:'Canarias,España',
    madrid:'Madrid,España', valencia:'Valencia,España',
    cualquiera:'España'
  };
  const destination = encodeURIComponent(regionMap[region] || searchTerm || 'España');
  const query = encodeURIComponent(searchTerm || 'retiro bienestar');
  return `https://www.booking.com/searchresults.es.html?aid=${BOOKING_AID}&ss=${query}+${destination}&lang=es`;
}

function buildGYGLink(searchTerm, region) {
  const query = encodeURIComponent((searchTerm || 'retiro bienestar') + ' España');
  return `https://www.getyourguide.es/s/?q=${query}&partner_id=GETYOURGUIDE_PARTNER_ID`;
}

// ── STATE ───────────────────────────────────────────────────────────
const state = { step:0, tipo:[], duracion:null, presupuesto:600, nivel:null, exclusividad:null };

const steps = [
  {
    id:'tipo', label:'¿Qué tipo de experiencia buscas?', hint:'Puedes elegir más de una opción', type:'multi-pill',
    options:[
      {value:'yoga',label:'🧘 Yoga'},{value:'meditacion',label:'🕯️ Meditación'},
      {value:'detox',label:'🌿 Detox'},{value:'silencio',label:'🤫 Silencio'},
      {value:'ayurveda',label:'✨ Ayurveda'},{value:'naturaleza',label:'🏔️ Naturaleza'},
      {value:'respiracion',label:'💨 Breathwork'},{value:'escritura',label:'✍️ Escritura'}
    ]
  },
  {
    id:'duracion', label:'¿Cuánto tiempo tienes?', hint:'Elige la opción que mejor encaje', type:'pill',
    options:[
      {value:'finde',label:'Un fin de semana'},{value:'semana_corta',label:'3–5 días'},
      {value:'semana',label:'Una semana'},{value:'mas',label:'Más de una semana'}
    ]
  },
  {
    id:'presupuesto', label:'¿Cuál es tu presupuesto máximo?', hint:'Precio total incluyendo alojamiento', type:'range',
    min:100, max:3000, step:50, format:(v)=> v>=3000?'Sin límite':`${v}€`
  },
  {
    id:'nivel', label:'¿Cuál es tu nivel de experiencia?', hint:null, type:'radio-card',
    options:[
      {value:'principiante',icon:'🌱',label:'Principiante',sub:'Primera vez o muy poca experiencia'},
      {value:'intermedio',icon:'🌿',label:'Intermedio',sub:'Algo de práctica previa'},
      {value:'avanzado',icon:'🌳',label:'Avanzado',sub:'Práctica regular y constante'},
      {value:'indiferente',icon:'🌾',label:'Me da igual',sub:'Lo importante es desconectar'}
    ]
  },
  {
    id:'exclusividad', label:'¿Qué ambiente prefieres?', hint:null, type:'radio-card',
    options:[
      {value:'budget',icon:'🏕️',label:'Sencillo y auténtico',sub:'Lo importante es la experiencia'},
      {value:'medio',icon:'🏡',label:'Confort equilibrado',sub:'Buenas instalaciones, precio razonable'},
      {value:'premium',icon:'🏛️',label:'Premium',sub:'Alto nivel, grupos pequeños'},
      {value:'exclusivo',icon:'💎',label:'Exclusivo',sub:'Máximo lujo, total personalización'}
    ]
  }
];

// ── RENDER ──────────────────────────────────────────────────────────
function renderStep() {
  const s = steps[state.step];
  // dots
  const dotsEl = document.getElementById('stepsIndicator');
  dotsEl.innerHTML = steps.map((_,i)=>{
    const cls = i<state.step?'done':i===state.step?'active':'';
    return `<div class="step-dot ${cls}"></div>`;
  }).join('');

  let html = `<div class="q-block"><div class="q-label">${s.label}</div>${s.hint?`<div class="q-hint">${s.hint}</div>`:''}`;

  if(s.type==='pill'){
    html+=`<div class="pill-group">${s.options.map(o=>`<div class="pill${state[s.id]===o.value?' selected':''}" onclick="pick('${s.id}','${o.value}')">${o.label}</div>`).join('')}</div>`;
  }
  if(s.type==='multi-pill'){
    const arr=state[s.id]||[];
    html+=`<div class="pill-group">${s.options.map(o=>`<div class="pill multi${arr.includes(o.value)?' selected':''}" onclick="toggle('${s.id}','${o.value}')">${o.label}</div>`).join('')}</div>`;
  }
  if(s.type==='range'){
    const v=state[s.id]||s.min;
    html+=`<div class="slider-wrap"><div class="range-val" id="rv">${s.format(v)}</div><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${v}" oninput="updateRange('${s.id}',this.value)"><div class="range-labels"><span>${s.format(s.min)}</span><span>${s.format(s.max)}</span></div></div>`;
  }
  if(s.type==='radio-card'){
    html+=`<div class="radio-grid">${s.options.map(o=>`<div class="radio-card${state[s.id]===o.value?' selected':''}" onclick="pick('${s.id}','${o.value}')"><div class="radio-card-icon">${o.icon}</div><div class="radio-card-title">${o.label}</div><div class="radio-card-sub">${o.sub}</div></div>`).join('')}</div>`;
  }
  html+='</div>';

  const isLast = state.step===steps.length-1;
  const ok = canNext();
  html+=`<div style="display:flex;gap:10px;margin-top:4px;">`;
  if(state.step>0) html+=`<button class="back-btn" onclick="prev()">← Atrás</button>`;
  if(!isLast) html+=`<button class="cta-btn" onclick="next()" ${ok?'':'disabled'} style="margin-top:0;">Continuar →</button>`;
  else html+=`<button class="cta-btn" onclick="findRetreats()" ${ok?'':'disabled'} style="margin-top:0;">✦ Encontrar mi retiro</button>`;
  html+=`</div>`;

  document.getElementById('formContent').innerHTML=html;
}

function canNext(){
  const s=steps[state.step];
  if(s.type==='multi-pill') return (state[s.id]||[]).length>0;
  if(s.type==='range') return true;
  return !!state[s.id];
}
function pick(f,v){ state[f]=v; renderStep(); }
function toggle(f,v){ if(!state[f])state[f]=[]; const i=state[f].indexOf(v); i>-1?state[f].splice(i,1):state[f].push(v); renderStep(); }
function updateRange(f,v){ state[f]=parseInt(v); const el=document.getElementById('rv'); if(el)el.textContent=steps[state.step].format(parseInt(v)); }
function next(){ if(canNext()){state.step++;renderStep();} }
function prev(){ if(state.step>0){state.step--;renderStep();} }

// ── FIND RETREATS ────────────────────────────────────────────────────
async function findRetreats(){
  const right=document.getElementById('rightPanel');
  right.innerHTML=`<div class="loading-wrap"><div class="spinner"></div><div class="loading-txt">Buscando tu retiro ideal…</div><div class="loading-sub">Analizando más de 340 opciones en España</div></div>`;
  document.querySelector('.cta-btn').disabled=true;

  const tMap={yoga:'Yoga',meditacion:'Meditación',detox:'Detox',silencio:'Silencio',ayurveda:'Ayurveda',naturaleza:'Naturaleza',respiracion:'Breathwork',escritura:'Escritura creativa'};
  const tipos=(state.tipo||[]).map(t=>tMap[t]||t).join(', ');
  const durMap={finde:'fin de semana (2-3 días)',semana_corta:'3-5 días',semana:'7 días',mas:'más de 7 días'};
  const nivMap={principiante:'principiante',intermedio:'intermedio',avanzado:'avanzado',indiferente:'cualquier nivel'};
  const excMap={budget:'sencillo y auténtico',medio:'confort equilibrado',premium:'premium',exclusivo:'exclusivo y de lujo'};

  const prompt=`Eres un experto en retiros de bienestar en España. El usuario busca:
- Tipos: ${tipos}
- Duración: ${durMap[state.duracion]||state.duracion}
- Presupuesto: ${state.presupuesto>=3000?'sin límite':state.presupuesto+'€'}
- Nivel: ${nivMap[state.nivel]||state.nivel}
- Ambiente: ${excMap[state.exclusividad]||state.exclusividad}

Genera EXACTAMENTE 4 recomendaciones de retiros en España. Para cada uno indica la plataforma más adecuada: "booking" si tiene presencia en Booking.com, "getyourguide" si es una experiencia/actividad, "directo" si es un centro boutique independiente.

Responde SOLO en JSON válido sin backticks:
{
  "insight": "2-3 frases personalizadas explicando por qué estas opciones encajan, tono cálido y experto.",
  "retreats": [
    {
      "name": "Nombre del retiro",
      "location": "Región, Provincia",
      "emoji": "emoji representativo",
      "tipo": ["etiqueta1","etiqueta2"],
      "desc": "2-3 frases sobre la esencia del retiro y por qué encaja con este perfil.",
      "duracion": "ej: 5 días",
      "precio_desde": 590,
      "plataforma": "booking|getyourguide|directo",
      "region_key": "andalucia|cataluna|galicia|canarias|madrid|valencia|cualquiera",
      "search_term": "término de búsqueda en español para esta experiencia",
      "match": 92
    }
  ]
}`;

  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok) throw new Error(`Error ${res.status}`);
    const data=await res.json();
    const text=data.content.map(b=>b.text||'').join('');
    const result=JSON.parse(text.replace(/```json|```/g,'').trim());
    renderResults(result);
  } catch(err){
    right.innerHTML=`<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Error al cargar</div><div class="empty-sub" style="color:#c0392b">${err.message}</div></div>`;
    document.querySelector('.cta-btn').disabled=false;
    document.querySelector('.cta-btn').textContent='Intentar de nuevo';
  }
}

// ── RENDER RESULTS ───────────────────────────────────────────────────
function renderResults(data){
  const right=document.getElementById('rightPanel');
  const tMap={yoga:'Yoga',meditacion:'Meditación',detox:'Detox',silencio:'Silencio',ayurveda:'Ayurveda',naturaleza:'Naturaleza',respiracion:'Breathwork',escritura:'Escritura'};
  const tipos=(state.tipo||[]).map(t=>tMap[t]||t).join(' · ');

  const pCfg={
    booking:{label:'Booking.com',cls:'platform-booking',comm:'~3.75% del precio',commFn:(p)=>Math.round(p*0.15*0.25)},
    getyourguide:{label:'GetYourGuide',cls:'platform-gyg',comm:'~8% del precio',commFn:(p)=>Math.round(p*0.08)},
    directo:{label:'Acuerdo directo',cls:'platform-directo',comm:'10–20% acordado',commFn:(p)=>Math.round(p*0.15)}
  };

  let totalComm=0;
  data.retreats.forEach(r=>{const cfg=pCfg[r.plataforma]||pCfg.directo; totalComm+=cfg.commFn(r.precio_desde);});

  let html=`
    <div style="margin-bottom:28px;">
      <div class="results-eyebrow">Recomendaciones personalizadas</div>
      <div class="results-title">Encontramos <em>${data.retreats.length} retiros</em> para ti</div>
      <div class="results-sub">${tipos} · ${state.presupuesto>=3000?'Sin límite':('hasta '+state.presupuesto+'€')}</div>
    </div>
    <div class="insight-box">${data.insight}</div>
    <div class="affiliate-note"><strong>💡 Transparencia:</strong> Al reservar desde Wellnest Guide pagas el mismo precio que en la plataforma. Recibimos una comisión de referido que nos permite mantener el directorio gratuito.</div>`;

  const bgMap={yoga:'linear-gradient(135deg,#8fa37e,#5a7250)',meditacion:'linear-gradient(135deg,#a89070,#6d5540)',detox:'linear-gradient(135deg,#6b9e8a,#3d7060)',silencio:'linear-gradient(135deg,#9090a0,#505060)',ayurveda:'linear-gradient(135deg,#c4a060,#8a6030)',naturaleza:'linear-gradient(135deg,#7aaa7a,#3a6a3a)'};

  data.retreats.forEach(r=>{
    const cfg=pCfg[r.plataforma]||pCfg.directo;
    const comm=cfg.commFn(r.precio_desde);
    const bg=bgMap[r.tipo?.[0]]||'linear-gradient(135deg,#8fa37e,#5a7250)';
    const bookUrl=r.plataforma==='booking'
      ? buildBookingLink(r.search_term,r.region_key)
      : r.plataforma==='getyourguide'
      ? buildGYGLink(r.search_term,r.region_key)
      : `mailto:hola@wellnest.guide?subject=Consulta retiro: ${encodeURIComponent(r.name)}`;

    html+=`<div class="result-card">
      <div class="card-header">
        <div class="card-visual" style="background:${bg};color:white;font-size:28px;">${r.emoji||'🌿'}</div>
        <div class="card-info">
          <span class="platform-badge ${cfg.cls}">${cfg.label}</span>
          <div class="card-name">${r.name}</div>
          <div class="card-location">📍 ${r.location}</div>
          <div class="card-tags">${(r.tipo||[]).map(t=>`<span class="card-tag">${t}</span>`).join('')}<span class="card-tag">${r.duracion}</span></div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-desc">${r.desc}</div>
        <div class="card-footer">
          <div><div class="price-from">desde</div><div class="price-num">${r.precio_desde}€</div><div class="price-unit">/ persona</div></div>
          <div class="card-right">
            <div class="match-wrap"><div class="match-bar"><div class="match-fill" style="width:${r.match||88}%"></div></div>${r.match||88}% encaje</div>
            <span class="comm-badge">Comisión: ${cfg.comm}</span>
            <a href="${bookUrl}" target="_blank" rel="noopener" class="book-btn">Reservar →</a>
          </div>
        </div>
      </div>
    </div>`;
  });

  html+=`<div class="comm-summary">
    <h4>📊 Tu potencial de ingresos estimado</h4>
    ${data.retreats.map(r=>{
      const cfg=pCfg[r.plataforma]||pCfg.directo;
      const comm=cfg.commFn(r.precio_desde);
      return `<div class="comm-row"><span class="comm-label">${r.name.length>32?r.name.slice(0,30)+'…':r.name} <span style="font-size:10px;opacity:.6">(${cfg.label})</span></span><span class="comm-val">${comm>0?'~'+comm+'€/reserva':'Negociar'}</span></div>`;
    }).join('')}
    <div class="comm-row"><span class="comm-label">1 reserva/semana de cada → por mes</span><span class="comm-val" style="color:var(--earth)">~${Math.round(totalComm*4)}€/mes</span></div>
  </div>
  <div style="margin-top:16px;text-align:center;">
    <button onclick="reset()" style="background:none;border:none;font-size:12px;color:#bbb;cursor:pointer;text-decoration:underline;">Buscar con otros criterios</button>
  </div>`;

  right.innerHTML=html;
}

function reset(){
  Object.assign(state,{step:0,tipo:[],duracion:null,presupuesto:600,nivel:null,exclusividad:null});
  renderStep();
  document.getElementById('rightPanel').innerHTML=`<div class="empty-state"><div class="empty-icon">🌿</div><div class="empty-title">Tus recomendaciones<br>aparecerán aquí</div><div class="empty-sub">Completa el formulario y nuestra IA buscará<br>los retiros que mejor encajan contigo.</div></div>`;
}

renderStep();
</script>
</body>
</html>
